<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Xiaoyu Feng - turning technology opportunities into market outcomes and scalable organizations."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Xiaoyu Feng - Strategy & Transformation</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('portfolio-theme');
          document.documentElement.dataset.theme = theme === 'dark' || theme === 'light' ? theme : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
